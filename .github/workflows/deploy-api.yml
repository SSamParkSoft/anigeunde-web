name: Deploy API

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-api
  cancel-in-progress: false

jobs:
  deploy:
    name: OCI production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.CD_API_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-api
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Check deployment configuration
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          test -n "$OCI_HOST"
          test -n "$OCI_USER"
          test -n "$OCI_SSH_PRIVATE_KEY"
          test -n "$OCI_KNOWN_HOSTS"

      - name: Configure SSH
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$HOME/.ssh/anigeunde_deploy"
          printf '%s\n' "$OCI_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/anigeunde_deploy" "$HOME/.ssh/known_hosts"

      - name: Upload release
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          release_dir="/opt/anigeunde/releases/$RELEASE_SHA"
          ssh -i "$HOME/.ssh/anigeunde_deploy" "$OCI_USER@$OCI_HOST" \
            "install -d -m 2750 '$release_dir/apps/api'"
          rsync -az --no-owner --no-group --chmod=D2750,F0640 \
            --exclude '__pycache__' --exclude '.pytest_cache' --exclude '.ruff_cache' \
            --exclude '*.db' --exclude '*.sqlite3' \
            -e "ssh -i $HOME/.ssh/anigeunde_deploy" \
            apps/api/ "$OCI_USER@$OCI_HOST:$release_dir/apps/api/"

      - name: Activate release and smoke test
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          ssh -i "$HOME/.ssh/anigeunde_deploy" "$OCI_USER@$OCI_HOST" \
            "bash -s -- '/opt/anigeunde/releases/$RELEASE_SHA'" \
            < infra/scripts/activate-api-release.sh

      - name: Public readiness check
        if: vars.API_HEALTH_URL != ''
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 "$API_HEALTH_URL"
